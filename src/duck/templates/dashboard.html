<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { display: inline-block; padding: 10px 20px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1> Все отлично, ты на сайте!</h1>
        <p>Добро пожаловать, <strong>{{ username }}</strong>!</p>
        
         <div class="balance-box">
        <div>Ваш текущий баланс:</div>
        <div class="balance-amount">{{ balance }} ₽</div>
    </div>
        <a href="/logout" class="btn">Выйти</a>
    </div>
</body>
</html>
