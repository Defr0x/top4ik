<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — NeuroAPI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body class="auth-page">

<main class="card glass">
    <div class="badge">🧠</div>
    <h2>С возвращением!</h2>
    <p class="subtitle">Войди, чтобы управлять API-ключами</p>

    <form id="loginForm" novalidate>
        <label class="field">
            <span>Email</span>
            <input type="email" id="email" placeholder="example@mail.ru" autocomplete="email" required>
        </label>

        <label class="field">
            <span>Пароль</span>
            <div class="password-wrap">
                <input type="password" id="password" placeholder="Твой пароль" autocomplete="current-password" required>
                <button type="button" class="toggle-pass" aria-label="Показать пароль">👁</button>
            </div>
        </label>

        <div class="form-error" id="error-msg" role="alert"></div>

        <button class="btn" type="submit">Войти</button>
    </form>

    <p class="switch">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</main>

</body>
</html>
